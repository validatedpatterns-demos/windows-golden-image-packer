name: Packer validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packer
    steps:
      - uses: actions/checkout@v4

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "1.11.2"

      - name: Prepare CI validate stubs
        run: bash ../scripts/prepare-ci-validate.sh

      - name: Packer init
        run: packer init .

      - name: Validate unattend answer files
        run: bash ../scripts/validate-unattend.sh
        env:
          VAR_FILE: ci.pkrvars.hcl

      - name: Packer validate
        run: packer validate -var-file=ci.pkrvars.hcl .
